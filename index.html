<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>إطعام مريومة</title>
    <style>
        /* --- General Styles --- */
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Cairo', Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; background: #333; touch-action: none; }
        button { cursor: pointer; font-family: inherit; }

        /* --- Containers --- */
        .page {
            width: 100%; max-width: 450px; height: 100%;
            background: #f0f0f0; display: none; /* Hide all pages by default */
            flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,.5);
        }
        #game-container { display: flex; } /* Show game page initially */

        /* --- Game UI --- */
        #info-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; font-size: 20px; background: #fff;
        }
        #profile-btn {
            font-size: 22px; background: none; border: none; padding: 0 5px;
            width: 40px; height: 40px; border-radius: 50%;
            background-size: cover; background-position: center;
            visibility: hidden; /* Hidden until user logs in */
        }
        #pause-btn { font-size: 24px; background: none; border: none; padding: 0 10px; }
        #game-board {
            position: relative; flex-grow: 1;
            background: lightpink; overflow: hidden;
            border-top: 3px solid #333; border-bottom: 3px solid #333;
        }
        #player {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%); width: 60px; height: 60px;
            display: none; object-fit: contain;
        }

        /* --- Shapes & Animations --- */
        .shape { position: absolute; top: -50px; }
        .circle { width: 30px; height: 30px; background: #f44336; border-radius: 50%; }
        .triangle { width: 40px; height: 40px; background: url('obstacle.png') center/contain no-repeat; }
        .collected-animation { animation: collect 0.3s ease; }
        @keyframes collect { 50% { transform: translateX(-50%) scale(1.2); } }

        /* --- Overlays --- */
        .overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,.7);
            color: white; z-index: 10; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .overlay button {
            padding: 15px 30px; font-size: 22px; border: none; border-radius: 10px;
            background: #ffc107; margin-top: 15px;
        }
        #start-screen .button-group { display: flex; gap: 10px; margin-top: 10px; }
        #start-screen .button-group button { font-size: 18px; padding: 12px 20px; margin-top: 0; }

        /* --- Input Fields --- */
        .input-field {
            padding: 10px; font-size: 18px; border-radius: 8px; border: 2px solid #ddd;
            margin-bottom: 10px; text-align: center; direction: ltr; width: 80%;
        }
        #start-btn:disabled { background: #999; cursor: not-allowed; }
        #validation-error { color: #ffc107; font-size: 14px; height: 16px; margin-bottom: 5px; }

        /* --- Controls & Timer Warning --- */
        .time-warning { color: red; font-weight: bold; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { transform: scale(1.1); } }
        #controls {
            position: absolute; bottom: 20px; width: 100%; display: flex;
            justify-content: space-between; padding: 0 10%; box-sizing: border-box;
        }
        #controls button {
            width: 80px; height: 60px; font-size: 36px; border-radius: 10px;
            background: rgba(255,255,255,.4); border: 2px solid rgba(255,255,255,.7);
        }

        /* --- Leaderboard Page Styles --- */
        #leaderboard-page { padding: 20px; box-sizing: border-box; text-align: center; }
        #leaderboard-page h1, #profile-page h1 { font-size: 28px; margin-bottom: 20px; }
        #leaderboard-list { list-style: none; padding: 0; margin: 0; width: 100%; }
        #leaderboard-list li { display: flex; align-items: center; padding: 8px 12px; margin-bottom: 8px; background: #e9e9e9; border-radius: 8px; font-size: 14px; }
        #leaderboard-list li span { flex: 1; text-align: right; }
        #leaderboard-list li .score { flex: 0 0 50px; text-align: center; font-weight: bold; }
        #leaderboard-list li .time { flex: 0 0 70px; text-align: center; color: #555; }
        #leaderboard-list li .status { flex: 0 0 30px; text-align: left; font-size: 18px; }
        #leaderboard-list li:nth-child(1) { background: #ffd700; font-weight: bold; }
        #leaderboard-list li:nth-child(2) { background: #c0c0c0; }
        #leaderboard-list li:nth-child(3) { background: #cd7f32; }
        #leaderboard-page button, #profile-page .back-btn { padding: 15px 40px; font-size: 20px; border-radius: 10px; background: #28a745; color: white; border: none; margin-top: 20px; }

        /* --- Profile Page Styles --- */
        #profile-page { padding: 30px; box-sizing: border-box; text-align: center; align-items: center; justify-content: center; }
        #profile-pic-container { position: relative; }
        #profile-pic-display { width: 150px; height: 150px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.3); object-fit: cover; background: #ccc; }
        #profile-pic-input { display: none; }
        #upload-pic-btn { position: absolute; bottom: 5px; right: 5px; width: 40px; height: 40px; border-radius: 50%; background: #007bff; color: white; border: 2px solid white; font-size: 20px; display: flex; justify-content: center; align-items: center; }
        #save-pic-btn { padding: 10px 20px; font-size: 16px; background: #ffc107; color: black; margin-top: 15px; border-radius: 8px; border: none; display: none; }
        #profile-username { font-size: 28px; font-weight: bold; margin-top: 20px; }
        #profile-highscore { font-size: 22px; color: #555; margin-top: 10px; }

    </style>
</head>
<body>

<!-- Page 1: Game -->
<div id="game-container" class="page">
    <div id="info-bar">
        <button id="profile-btn"></button>
        <div id="score">النقاط: 0</div>
        <div id="timer">الوقت: 02:30</div>
        <button id="pause-btn">⏸</button>
    </div>
    <div id="game-board">
        <div id="start-screen" class="overlay">
            <h1>إطعام مريومة</h1>
            <p>سجّل الدخول أو أنشئ حساباً جديداً</p>
            <div id="validation-error"></div>
            <input id="insta-user" class="input-field" placeholder="@user" maxlength="30">
            <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
            <div class="button-group">
                <button id="start-btn" disabled>دخول / تسجيل</button>
                <button id="view-leaderboard-btn">🏆 أفضل 10</button>
            </div>
        </div>
        <img id="player" src="character.png">
        <div id="controls">
            <button id="right-btn">→</button>
            <button id="left-btn">←</button>
        </div>
    </div>
</div>

<!-- Page 2: Leaderboard -->
<div id="leaderboard-page" class="page">
    <h1>🏆 قائمة أفضل 10 أبطال</h1>
    <ol id="leaderboard-list"><li>يتم التحميل...</li></ol>
    <button class="back-btn">العودة للعب</button>
</div>

<!-- Page 3: Profile -->
<div id="profile-page" class="page">
    <h1>ملفك الشخصي</h1>
    <div id="profile-pic-container">
        <img id="profile-pic-display" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23888' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Profile Picture">
        <input type="file" id="profile-pic-input" accept="image/*">
        <button id="upload-pic-btn" onclick="document.getElementById('profile-pic-input').click()">✏️</button>
    </div>
    <button id="save-pic-btn">حفظ الصورة</button>
    <div id="profile-username">@username</div>
    <div id="profile-highscore">أعلى نقاط: 0</div>
    <button class="back-btn">العودة للعب</button>
</div>


<audio id="collect-sound" src="collect.mp3"></audio>
<audio id="lose-sound" src="lose.mp3"></audio>

<!-- ========== FIREBASE v12 ========== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, setDoc, addDoc, query, orderBy, limit, getDocs, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsJ6fm4SFNLnRuHj-b80L0BweGVNkoiIM",
      authDomain: "game-21f55.firebaseapp.com",
      projectId: "game-21f55",
      storageBucket: "game-21f55.firebasestorage.app",
      messagingSenderId: "88852711134",
      appId: "1:88852711134:web:c504445d3d800c3e13244f"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const leaderboardRef = collection(db, "leaderboard");
    const usersRef = collection(db, "users");

    /* ---------- DOM ELEMENTS ---------- */
    const pages = document.querySelectorAll('.page');
    const gameContainer = document.getElementById("game-container");
    const leaderboardPage = document.getElementById("leaderboard-page");
    const profilePage = document.getElementById("profile-page");
    const board = document.getElementById("game-board");
    const player = document.getElementById("player");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const startScreen = document.getElementById("start-screen");
    const leaderboardList = document.getElementById("leaderboard-list");
    const collectSound = document.getElementById("collect-sound");
    const loseSound = document.getElementById("lose-sound");
    const leftBtn = document.getElementById("left-btn");
    const rightBtn = document.getElementById("right-btn");
    const startBtn = document.getElementById("start-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const viewLeaderboardBtn = document.getElementById("view-leaderboard-btn");
    const instaUser = document.getElementById("insta-user");
    const passwordInput = document.getElementById("password");
    const validationError = document.getElementById("validation-error");
    const backBtns = document.querySelectorAll('.back-btn');
    const profileBtn = document.getElementById('profile-btn');

    // Profile Page Elements
    const profilePicDisplay = document.getElementById('profile-pic-display');
    const profilePicInput = document.getElementById('profile-pic-input');
    const savePicBtn = document.getElementById('save-pic-btn');
    const profileUsername = document.getElementById('profile-username');
    const profileHighscore = document.getElementById('profile-highscore');

    /* ---------- GAME STATE ---------- */
    const INITIAL_TIME = 150; // 2.5 minutes
    let score = 0, time = INITIAL_TIME, speed = 6;
    let isGameOver = false, isPaused = false, frenzy = false;
    let move = { left: false, right: false };
    let shapeInterval, timerInterval, gameLoopId;
    let fallingShapes = [];
    let currentUser = null; // To hold the logged-in user's data

    /* ---------- SECURITY & UTILS ---------- */
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /* ---------- PAGE NAVIGATION ---------- */
    function showPage(pageToShow) {
        pages.forEach(p => p.style.display = 'none');
        pageToShow.style.display = 'flex';
    }
    viewLeaderboardBtn.onclick = () => {
        loadLeaderboard();
        showPage(leaderboardPage);
    };
    profileBtn.onclick = () => {
        if (!currentUser) return; // Should not happen if button is visible
        loadProfile();
        showPage(profilePage);
    };
    backBtns.forEach(btn => btn.onclick = () => showPage(gameContainer));

    /* ---------- USER AUTH & PROFILE ---------- */
    const instaRegex = /^@[a-zA-Z0-9_]{1,30}$/;
    function validateInputs() {
        const user = instaUser.value;
        const pass = passwordInput.value;
        if (instaRegex.test(user) && pass.length >= 6) {
            startBtn.disabled = false;
            validationError.textContent = '';
        } else {
            startBtn.disabled = true;
            if (user && !instaRegex.test(user)) {
                validationError.textContent = 'اليوزر يجب أن يبدأ بـ @';
            } else if (user && pass && pass.length < 6) {
                validationError.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
            } else {
                 validationError.textContent = '';
            }
        }
    }
    instaUser.addEventListener('input', validateInputs);
    passwordInput.addEventListener('input', validateInputs);

    startBtn.onclick = async () => {
        const username = instaUser.value;
        const password = passwordInput.value;
        startBtn.disabled = true;
        startBtn.textContent = 'جاري التحقق...';
        validationError.textContent = '';

        try {
            const userDocRef = doc(db, "users", username);
            const userDoc = await getDoc(userDocRef);
            const hashedPassword = await hashPassword(password);

            if (userDoc.exists()) {
                // User exists -> LOGIN
                const userData = userDoc.data();
                if (userData.passwordHash === hashedPassword) {
                    currentUser = { username, ...userData };
                    showWelcomeMessage(`أهلاً بعودتك ${username}`);
                    loginSuccess();
                } else {
                    validationError.textContent = 'كلمة المرور غير صحيحة.';
                }
            } else {
                // New user -> REGISTER
                const newUser = {
                    username,
                    highScore: 0,
                    profilePictureUrl: null,
                    passwordHash: hashedPassword,
                    createdAt: serverTimestamp()
                };
                await setDoc(userDocRef, newUser);
                currentUser = newUser;
                showWelcomeMessage(`أهلاً بك ${username}! تم إنشاء حسابك.`);
                loginSuccess();
            }
        } catch (error) {
            console.error("Auth Error: ", error);
            validationError.textContent = 'حدث خطأ، حاول مرة أخرى.';
        } finally {
            startBtn.disabled = false;
            startBtn.textContent = 'دخول / تسجيل';
        }
    };
    
    function loginSuccess() {
        localStorage.setItem('savedMariomaUser', currentUser.username);
        updateProfileIcon();
        profileBtn.style.visibility = 'visible'; // Show profile icon
        startScreen.style.display = "none";
        player.style.display = "block";
        startGame();
    }
    
    async function loadProfile() {
        if (!currentUser) return;
        
        const userDoc = await getDoc(doc(db, "users", currentUser.username));
        if (userDoc.exists()) {
             currentUser = { username: currentUser.username, ...userDoc.data() };
        }

        profileUsername.textContent = currentUser.username;
        profileHighscore.textContent = `أعلى نقاط: ${currentUser.highScore || 0}`;
        if (currentUser.profilePictureUrl) {
            profilePicDisplay.src = currentUser.profilePictureUrl;
        } else {
             profilePicDisplay.src = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23888' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E`;
        }
    }
    
    profilePicInput.onchange = (event) => {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                profilePicDisplay.src = e.target.result;
                savePicBtn.style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }
    };
    
    savePicBtn.onclick = async () => {
        if (!currentUser || !profilePicInput.files[0]) return;
        savePicBtn.disabled = true;
        savePicBtn.textContent = 'جاري الرفع...';
        const file = profilePicInput.files[0];
        const storageRef = ref(storage, `profile_pictures/${currentUser.username}`);
        try {
            const snapshot = await uploadBytes(storageRef, file);
            const downloadURL = await getDownloadURL(snapshot.ref);
            await updateDoc(doc(db, "users", currentUser.username), { profilePictureUrl: downloadURL });
            currentUser.profilePictureUrl = downloadURL;
            updateProfileIcon();
            savePicBtn.style.display = 'none';
            showWelcomeMessage('تم حفظ الصورة بنجاح');
        } catch (error) {
            console.error("Error uploading image: ", error);
            showWelcomeMessage('فشل رفع الصورة');
        } finally {
            savePicBtn.disabled = false;
            savePicBtn.textContent = 'حفظ الصورة';
        }
    };

    function updateProfileIcon() {
        if (currentUser && currentUser.profilePictureUrl) {
            profileBtn.style.backgroundImage = `url(${currentUser.profilePictureUrl})`;
        } else {
             profileBtn.style.backgroundImage = `url('data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"%3E%3Cpath fill="%23888" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/%3E%3C/svg%3E')`;
             profileBtn.style.backgroundColor = '#ddd';
        }
    }

    function showWelcomeMessage(message) {
        // ... (this function remains unchanged)
    }
    
    /* ---------- GAME CORE & CONTROLS (UNCHANGED) ---------- */
    // Functions: startGame, pauseGame, resumeGame, updateTimer, gameLoop, movePlayer, createShape, collide, endGame, controls...
    function startGame() { isPaused = false; isGameOver = true; setTimeout(() => { isGameOver = false; }, 100); resumeGame(); gameLoop(); }
    function pauseGame() { if (isGameOver) return; isPaused = true; pauseBtn.textContent = '▶️'; clearInterval(timerInterval); clearInterval(shapeInterval); }
    function resumeGame() { if (isGameOver) return; isPaused = false; pauseBtn.textContent = '⏸'; shapeInterval = setInterval(createShape, frenzy ? 450 : 1000); timerInterval = setInterval(updateTimer, 1000); }
    pauseBtn.onclick = () => { isPaused ? resumeGame() : pauseGame(); };
    function updateTimer() { time--; const minutes = Math.floor(time / 60).toString().padStart(2, '0'); const seconds = (time % 60).toString().padStart(2, '0'); timerEl.textContent = `الوقت: ${minutes}:${seconds}`; if (time <= 10 && !frenzy) { frenzy = true; timerEl.classList.add("time-warning"); clearInterval(shapeInterval); shapeInterval = setInterval(createShape, 450); } if (time <= 0) { winGame(); } }
    function gameLoop() { if (isGameOver || isPaused) { gameLoopId = requestAnimationFrame(gameLoop); return; } if (move.left) movePlayer(-speed); if (move.right) movePlayer(speed); for (let i = fallingShapes.length - 1; i >= 0; i--) { const shapeData = fallingShapes[i]; shapeData.y += shapeData.fallSpeed; shapeData.element.style.top = shapeData.y + "px"; if (collide(player, shapeData.element)) { if (shapeData.element.classList.contains("circle")) { score++; scoreEl.textContent = `النقاط: ${score}`; collectSound.currentTime = 0; collectSound.play(); player.classList.add("collected-animation"); setTimeout(() => player.classList.remove("collected-animation"), 300); shapeData.element.remove(); fallingShapes.splice(i, 1); } else { loseGame(); } } else if (shapeData.y > board.offsetHeight) { shapeData.element.remove(); fallingShapes.splice(i, 1); } } gameLoopId = requestAnimationFrame(gameLoop); }
    function movePlayer(dx) { const x = player.offsetLeft + dx; const max = board.offsetWidth - player.offsetWidth; player.style.left = Math.max(0, Math.min(max, x)) + "px"; }
    function createShape() { const s = document.createElement("div"); s.className = "shape " + (Math.random() < 0.7 ? "circle" : "triangle"); s.style.left = Math.random() * (board.offsetWidth - 40) + "px"; board.appendChild(s); fallingShapes.push({ element: s, y: -50, fallSpeed: (Math.random() * 3 + 2) * (frenzy ? 1.6 : 1) }); }
    function collide(a, b) { const A = a.getBoundingClientRect(); const B = b.getBoundingClientRect(); return !(A.right < B.left || A.left > B.right || A.bottom < B.top || A.top > B.bottom); }
    async function endGame(status) { if (isGameOver) return; isGameOver = true; pauseGame(); cancelAnimationFrame(gameLoopId); if (status === 'loss') { loseSound.play(); } await saveScore(status); showPage(leaderboardPage); }
    const winGame = () => endGame('win');
    const loseGame = () => endGame('loss');
    document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") move.left = true; if (e.key === "ArrowRight") move.right = true; });
    document.addEventListener("keyup", e => { if (e.key === "ArrowLeft") move.left = false; if (e.key === "ArrowRight") move.right = false; });
    leftBtn.addEventListener("mousedown", () => move.left = true); leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); move.left = true; });
    rightBtn.addEventListener("mousedown", () => move.right = true); rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); move.right = true; });
    document.addEventListener("mouseup", () => { move.left = false; move.right = false; });
    document.addEventListener("touchend", () => { move.left = false; move.right = false; });

    /* ---------- FIREBASE & LEADERBOARD ---------- */
    async function saveScore(status) {
        if (!currentUser || score <= 0) return;
        const timeSpent = INITIAL_TIME - time;
        try {
            await addDoc(leaderboardRef, { name: currentUser.username, score, timeSpent, status, createdAt: serverTimestamp() });
            if (score > (currentUser.highScore || 0)) {
                await updateDoc(doc(db, "users", currentUser.username), { highScore: score });
                currentUser.highScore = score;
            }
        } catch (error) { console.error("Error saving score: ", error); }
    }

    async function loadLeaderboard() {
        // ... (this function remains unchanged)
    }

    /* ---------- INITIAL SETUP ---------- */
    function loadSavedUser() {
        const savedUser = localStorage.getItem('savedMariomaUser');
        if (savedUser) {
            instaUser.value = savedUser;
            validateInputs();
        }
    }

    showPage(gameContainer);
    loadSavedUser();

</script>
</body>
</html>
