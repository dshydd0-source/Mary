<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>إطعام مريومة</title>
    <style>
        /* --- General Styles --- */
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Cairo', Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; background: #333; touch-action: none; }
        button { cursor: pointer; font-family: inherit; }

        /* --- Containers --- */
        .page {
            width: 100%; max-width: 450px; height: 100%;
            background: #f0f0f0; display: none; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,.5);
        }
        #game-container { display: flex; }

        /* --- Game UI & Info Bar --- */
        #info-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; font-size: 20px; background: #fff; }
        #profile-btn {
            background: #ccc; border: none; padding: 0; width: 40px; height: 40px;
            border-radius: 50%; background-size: cover; background-position: center;
            visibility: hidden; /* Hidden until user logs in */
        }
        #pause-btn { font-size: 24px; background: none; border: none; padding: 0 10px; }
        #game-board { position: relative; flex-grow: 1; background: lightpink; overflow: hidden; border-top: 3px solid #333; border-bottom: 3px solid #333; }
        #player { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; display: none; object-fit: contain; }

        /* --- Shapes & Animations --- */
        .shape { position: absolute; top: -50px; }
        .circle { width: 30px; height: 30px; background: #f44336; border-radius: 50%; }
        .triangle { width: 40px; height: 40px; background: url('obstacle.png') center/contain no-repeat; }
        /* NEW simpler animation */
        @keyframes simple-collect {
          50% { opacity: 0.6; }
        }
        .collected-animation { animation: simple-collect 0.2s ease-out; }

        /* --- Overlays --- */
        .overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,.7);
            color: white; z-index: 10; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .overlay button { padding: 15px 30px; font-size: 22px; border: none; border-radius: 10px; background: #ffc107; margin-top: 15px; }
        #start-screen .button-group { display: flex; gap: 10px; margin-top: 10px; }
        #start-screen .button-group button { font-size: 18px; padding: 12px 20px; margin-top: 0; }
        #game-over-overlay { display: none; }
        #game-over-overlay h2 { font-size: 32px; margin-bottom: 10px; }

        /* --- Input Fields --- */
        .input-field { padding: 10px; font-size: 18px; border-radius: 8px; border: 2px solid #ddd; margin-bottom: 10px; text-align: center; direction: ltr; width: 80%; }
        #start-btn:disabled { background: #999; cursor: not-allowed; }
        #validation-error { color: #ffc107; font-size: 14px; height: 16px; margin-bottom: 5px; }

        /* --- Controls & Timer --- */
        .time-warning { color: red; font-weight: bold; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { transform: scale(1.1); } }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 10%; box-sizing: border-box; }
        #controls button { width: 80px; height: 60px; font-size: 36px; border-radius: 10px; background: rgba(255,255,255,.4); border: 2px solid rgba(255,255,255,.7); }

        /* --- Leaderboard Page --- */
        #leaderboard-page { padding: 20px; box-sizing: border-box; text-align: center; }
        #leaderboard-page h1, #profile-page h1 { font-size: 28px; margin-bottom: 20px; }
        #leaderboard-list { list-style: none; padding: 0; margin: 0; width: 100%; }
        #leaderboard-list li { display: flex; align-items: center; padding: 8px 12px; margin-bottom: 8px; background: #e9e9e9; border-radius: 8px; font-size: 16px; }
        .leaderboard-pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #ccc; margin-left: 15px; }
        #leaderboard-list li .name { flex: 1; text-align: right; }
        #leaderboard-list li .score { flex: 0 0 60px; text-align: center; font-weight: bold; }
        #leaderboard-list li:nth-child(1) { background: #ffd700; font-weight: bold; }
        #leaderboard-list li:nth-child(2) { background: #c0c0c0; }
        #leaderboard-list li:nth-child(3) { background: #cd7f32; }
        .back-btn { padding: 15px 40px; font-size: 20px; border-radius: 10px; background: #28a745; color: white; border: none; margin-top: 20px; }

        /* --- Profile Page --- */
        #profile-page { padding: 30px; box-sizing: border-box; text-align: center; align-items: center; justify-content: center; }
        #profile-pic-container { position: relative; }
        #profile-pic-display { width: 150px; height: 150px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.3); object-fit: cover; background: #ccc; }
        #profile-pic-input { display: none; }
        #upload-pic-btn { position: absolute; bottom: 5px; right: 5px; width: 40px; height: 40px; border-radius: 50%; background: #007bff; color: white; border: 2px solid white; font-size: 20px; display: flex; justify-content: center; align-items: center; }
        #save-pic-btn { padding: 10px 20px; font-size: 16px; background: #ffc107; color: black; margin-top: 15px; border-radius: 8px; border: none; display: none; }
        #profile-username { font-size: 28px; font-weight: bold; margin-top: 20px; }
        #profile-highscore { font-size: 22px; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

<!-- Page 1: Game -->
<div id="game-container" class="page">
    <div id="info-bar">
        <button id="profile-btn"></button>
        <div id="score">النقاط: 0</div>
        <div id="timer">الوقت: 00:00</div>
        <button id="pause-btn">⏸</button>
    </div>
    <div id="game-board">
        <div id="start-screen" class="overlay">
            <h1>إطعام مريومة</h1>
            <p>سجّل الدخول أو أنشئ حساباً</p>
            <div id="validation-error"></div>
            <input id="insta-user" class="input-field" placeholder="يوزر الانستغرام (@user)" maxlength="30">
            <input type="text" id="private-id" class="input-field" placeholder="المعرّف الخاص (6+ حروف وأرقام)">
            <div class="button-group">
                <button id="start-btn" disabled>دخول / تسجيل</button>
                <button id="view-leaderboard-btn">🏆 أفضل 10</button>
            </div>
        </div>
        <div id="game-over-overlay" class="overlay">
            <h2>للأسف، خسرت!</h2>
            <p id="final-score-text" style="font-size: 24px;">نقاطك: 0</p>
        </div>
        <img id="player" src="character.png">
        <div id="controls">
            <button id="right-btn">→</button>
            <button id="left-btn">←</button>
        </div>
    </div>
</div>

<!-- Page 2: Leaderboard -->
<div id="leaderboard-page" class="page">
    <h1>🏆 قائمة أفضل 10 أبطال</h1>
    <ol id="leaderboard-list"><li>يتم التحميل...</li></ol>
    <button class="back-btn">العب مرة أخرى</button>
</div>

<!-- Page 3: Profile -->
<div id="profile-page" class="page">
    <h1>ملفك الشخصي</h1>
    <div id="profile-pic-container">
        <img id="profile-pic-display" crossorigin="anonymous" src="..." alt="Profile Picture">
        <input type="file" id="profile-pic-input" accept="image/*">
        <button id="upload-pic-btn" onclick="document.getElementById('profile-pic-input').click()">✏️</button>
    </div>
    <button id="save-pic-btn">حفظ الصورة</button>
    <div id="profile-username">@username</div>
    <div id="profile-highscore">أعلى نقاط: 0</div>
    <button class="back-btn">العودة للعب</button>
</div>

<audio id="collect-sound" src="collect.mp3"></audio>
<audio id="lose-sound" src="lose.mp3"></audio>
<!-- تم التعديل: إضافة مشغل موسيقى الخلفية -->
<!-- ملاحظة: يجب تغيير 'background_music.mp3' إلى اسم ومسار ملف الموسيقى الصحيح -->
<audio id="background-music" src="background.mp3" loop></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, setDoc, query, orderBy, limit, getDocs, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsJ6fm4SFNLnRuHj-b80L0BweGVNkoiIM",
      authDomain: "game-21f55.firebaseapp.com",
      projectId: "game-21f55",
      storageBucket: "game-21f55.firebasestorage.app",
      messagingSenderId: "88852711134",
      appId: "1:88852711134:web:c504445d3d800c3e13244f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const usersRef = collection(db, "users");

    const pages = document.querySelectorAll('.page');
    const gameContainer = document.getElementById("game-container");
    const leaderboardPage = document.getElementById("leaderboard-page");
    const profilePage = document.getElementById("profile-page");
    const board = document.getElementById("game-board");
    const player = document.getElementById("player");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const startScreen = document.getElementById("start-screen");
    const gameOverOverlay = document.getElementById("game-over-overlay");
    const finalScoreText = document.getElementById("final-score-text");
    const leaderboardList = document.getElementById("leaderboard-list");
    const collectSound = document.getElementById("collect-sound");
    const loseSound = document.getElementById("lose-sound");
    const backgroundMusic = document.getElementById("background-music"); // تم التعديل: الحصول على عنصر الموسيقى
    const startBtn = document.getElementById("start-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const viewLeaderboardBtn = document.getElementById("view-leaderboard-btn");
    const instaUser = document.getElementById("insta-user");
    const privateIdInput = document.getElementById("private-id");
    const validationError = document.getElementById("validation-error");
    const backBtns = document.querySelectorAll('.back-btn');
    const profileBtn = document.getElementById('profile-btn');
    const profilePicDisplay = document.getElementById('profile-pic-display');
    const profilePicInput = document.getElementById('profile-pic-input');
    const savePicBtn = document.getElementById('save-pic-btn');
    const profileUsername = document.getElementById('profile-username');
    const profileHighscore = document.getElementById('profile-highscore');

    const INITIAL_TIME = 600; // تم التعديل: 10 دقائق (600 ثانية)
    let score = 0, time = 0, speed = 6, speedModifier = 1.0; // تم التعديل: إضافة متغير لزيادة السرعة
    let isGameOver = true, isPaused = false, frenzy = false;
    let move = { left: false, right: false };
    let shapeInterval, timerInterval, gameLoopId;
    let fallingShapes = [];
    let currentUser = null;
    const defaultPic = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23888' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E`;
    profilePicDisplay.src = defaultPic;


    function showPage(pageToShow) {
        pages.forEach(p => p.style.display = 'none');
        pageToShow.style.display = 'flex';
    }

    viewLeaderboardBtn.onclick = () => {
        loadLeaderboard();
        showPage(leaderboardPage);
    };

    profileBtn.onclick = () => {
        if (!currentUser) return;
        loadProfile();
        showPage(profilePage);
    };

    backBtns.forEach(btn => {
        btn.onclick = () => {
            showPage(gameContainer);
            startNewGameRound();
        };
    });

    const instaRegex = /^@[a-zA-Z0-9_]{1,30}$/;
    const idRegex = /^[a-zA-Z0-9]{6,}$/; // UPDATED Regex

    function validateInputs() {
        const user = instaUser.value;
        const privateId = privateIdInput.value;
        if (instaRegex.test(user) && idRegex.test(privateId)) {
            startBtn.disabled = false;
            validationError.textContent = '';
        } else {
            startBtn.disabled = true;
            if (user && !instaRegex.test(user)) {
                validationError.textContent = 'يوزر الانستغرام يجب أن يبدأ بـ @';
            } else if (privateId && !idRegex.test(privateId)) {
                // UPDATED Validation message
                validationError.textContent = 'المعرّف الخاص يجب أن يتكون من 6 أحرف أو أرقام على الأقل';
            } else {
                validationError.textContent = '';
            }
        }
    }
    instaUser.addEventListener('input', validateInputs);
    privateIdInput.addEventListener('input', validateInputs);

    startBtn.onclick = async () => {
        const username = instaUser.value;
        const privateId = privateIdInput.value; // UPDATED variable name
        startBtn.disabled = true;
        startBtn.textContent = 'جاري التحقق...';
        validationError.textContent = '';

        try {
            const userDocRef = doc(db, "users", username);
            const userDoc = await getDoc(userDocRef);

            if (userDoc.exists()) {
                const userData = userDoc.data();
                if (userData.privateId === privateId) { // UPDATED field name
                    currentUser = { username, ...userData };
                    showWelcomeMessage(`أهلاً بعودتك ${username}`);
                    loginSuccess();
                } else {
                    validationError.textContent = 'المعرّف الخاص غير صحيح.';
                }
            } else {
                const newUser = {
                    username,
                    privateId, // UPDATED field name
                    highScore: 0,
                    profilePictureUrl: null,
                    createdAt: serverTimestamp()
                };
                await setDoc(userDocRef, newUser);
                currentUser = newUser;
                showWelcomeMessage(`أهلاً بك ${username}! تم إنشاء حسابك.`);
                loginSuccess();
            }
        } catch (error) {
            console.error("Auth Error: ", error);
            validationError.textContent = 'حدث خطأ، حاول مرة أخرى.';
        } finally {
            startBtn.disabled = false;
            startBtn.textContent = 'دخول / تسجيل';
        }
    };
    
    function loginSuccess() {
        localStorage.setItem('savedMariomaUser', JSON.stringify({u: currentUser.username, p: currentUser.privateId}));
        updateProfileIcon();
        profileBtn.style.visibility = 'visible';
        startScreen.style.display = "none";
        startNewGameRound();
    }

    function startNewGameRound() {
        score = 0;
        time = INITIAL_TIME;
        speedModifier = 1.0; // تم التعديل: إعادة تعيين معامل السرعة
        isGameOver = false;
        isPaused = false;
        frenzy = false;
        fallingShapes.forEach(s => s.element.remove());
        fallingShapes = [];
        scoreEl.textContent = `النقاط: 0`;
        timerEl.classList.remove("time-warning");
        player.style.display = "block";
        gameOverOverlay.style.display = "none";
        
        clearInterval(timerInterval);
        clearInterval(shapeInterval);
        cancelAnimationFrame(gameLoopId);
        
        // تم التعديل: إعادة تشغيل موسيقى الخلفية من البداية
        backgroundMusic.currentTime = 0;

        updateTimer();
        resumeGame();
        gameLoop();
    }

    function pauseGame() {
        if (isGameOver) return;
        isPaused = true;
        pauseBtn.textContent = '▶️';
        clearInterval(timerInterval);
        clearInterval(shapeInterval);
        backgroundMusic.pause(); // تم التعديل: إيقاف الموسيقى مؤقتاً
    }

    function resumeGame() {
        if (isGameOver) return;
        isPaused = false;
        pauseBtn.textContent = '⏸';
        shapeInterval = setInterval(createShape, frenzy ? 450 : 900);
        timerInterval = setInterval(updateTimer, 1000);
        backgroundMusic.play(); // تم التعديل: استئناف تشغيل الموسيقى
    }
    pauseBtn.onclick = () => { isPaused ? resumeGame() : pauseGame(); };

    function updateTimer() {
        const minutes = Math.floor(time / 60).toString().padStart(2, '0');
        const seconds = (time % 60).toString().padStart(2, '0');
        timerEl.textContent = `الوقت: ${minutes}:${seconds}`;

        // تم التعديل: زيادة السرعة كل دقيقة
        const minutesPassed = Math.floor((INITIAL_TIME - time) / 60);
        speedModifier = 1.0 + (minutesPassed * 0.2);

        // UPDATED Frenzy mode condition
        if (!frenzy && time > 0 && time <= (INITIAL_TIME / 2)) {
            frenzy = true;
            timerEl.classList.add("time-warning");
            clearInterval(shapeInterval);
            shapeInterval = setInterval(createShape, 450);
        }
        if (time <= 0) {
            winGame();
        }
        time--;
    }

    function endGame(status) {
        if (isGameOver) return;
        isGameOver = true;
        pauseGame(); // هذه الدالة توقف الموسيقى الآن
        cancelAnimationFrame(gameLoopId);
        
        if (status === 'loss') {
            loseSound.play();
            finalScoreText.textContent = `نقاطك: ${score}`;
            gameOverOverlay.style.display = 'flex';
        }
        
        saveScore();
        
        setTimeout(() => {
            gameOverOverlay.style.display = 'none';
            loadLeaderboard();
            showPage(leaderboardPage);
        }, status === 'loss' ? 3000 : 0);
    }

    const loseGame = () => endGame('loss');
    const winGame = () => endGame('win');

    async function saveScore() {
        if (!currentUser) return;
        if (score > (currentUser.highScore || 0)) {
            const userDocRef = doc(db, "users", currentUser.username);
            await updateDoc(userDocRef, {
                highScore: score,
                profilePictureUrl: currentUser.profilePictureUrl
            });
            currentUser.highScore = score;
        }
    }

    async function loadLeaderboard() {
        leaderboardList.innerHTML = "<li>يتم التحميل...</li>";
        try {
            const q = query(usersRef, orderBy("highScore", "desc"), limit(10));
            const snap = await getDocs(q);
            
            if (snap.empty) {
                leaderboardList.innerHTML = "<li>لا توجد نقاط بعد، كن أول الأبطال!</li>";
                return;
            }
            leaderboardList.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                if(data.highScore > 0) {
                    const li = document.createElement("li");
                    li.innerHTML = `
                        <img class="leaderboard-pic" crossorigin="anonymous" src="${data.profilePictureUrl || defaultPic}" alt="${data.username}">
                        <span class="name">${data.username}</span>
                        <strong class="score">${data.highScore}</strong>
                    `;
                    leaderboardList.appendChild(li);
                }
            });
        } catch (error) {
            console.error("Error loading leaderboard: ", error);
            leaderboardList.innerHTML = "<li>حدث خطأ في تحميل القائمة.</li>";
        }
    }
    
    function gameLoop() { if (isGameOver || isPaused) { gameLoopId = requestAnimationFrame(gameLoop); return; } if (move.left) movePlayer(-speed); if (move.right) movePlayer(speed); for (let i = fallingShapes.length - 1; i >= 0; i--) { const shapeData = fallingShapes[i]; shapeData.y += shapeData.fallSpeed; shapeData.element.style.top = shapeData.y + "px"; if (collide(player, shapeData.element)) { if (shapeData.element.classList.contains("circle")) { score++; scoreEl.textContent = `النقاط: ${score}`; collectSound.currentTime = 0; collectSound.play(); player.classList.add("collected-animation"); setTimeout(() => player.classList.remove("collected-animation"), 200); shapeData.element.remove(); fallingShapes.splice(i, 1); } else { loseGame(); } } else if (shapeData.y > board.offsetHeight) { shapeData.element.remove(); fallingShapes.splice(i, 1); } } gameLoopId = requestAnimationFrame(gameLoop); }
    function movePlayer(dx) { const x = player.offsetLeft + dx; const max = board.offsetWidth - player.offsetWidth; player.style.left = Math.max(0, Math.min(max, x)) + "px"; }
    
    function createShape() {
        const s = document.createElement("div");
        s.className = "shape " + (Math.random() < 0.7 ? "circle" : "triangle");
        s.style.left = Math.random() * (board.offsetWidth - 40) + "px";
        board.appendChild(s);
        // تم التعديل: تطبيق معامل السرعة على سرعة سقوط العناصر
        const baseFallSpeed = (Math.random() * 3 + 2);
        const finalFallSpeed = baseFallSpeed * speedModifier * (frenzy ? 1.6 : 1);
        fallingShapes.push({ element: s, y: -50, fallSpeed: finalFallSpeed });
    }

    function collide(a, b) { const A = a.getBoundingClientRect(); const B = b.getBoundingClientRect(); return !(A.right < B.left || A.left > B.right || A.bottom < B.top || A.top > B.bottom); }
    document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") move.left = true; if (e.key === "ArrowRight") move.right = true; });
    document.addEventListener("keyup", e => { if (e.key === "ArrowLeft") move.left = false; if (e.key === "ArrowRight") move.right = false; });
    document.querySelector("#left-btn").addEventListener("touchstart", (e) => { e.preventDefault(); move.left = true; });
    document.querySelector("#right-btn").addEventListener("touchstart", (e) => { e.preventDefault(); move.right = true; });
    document.addEventListener("touchend", () => { move.left = false; move.right = false; });
    document.addEventListener("mousedown", (e) => { if (e.target.id === 'left-btn') move.left = true; if (e.target.id === 'right-btn') move.right = true; });
    document.addEventListener("mouseup", () => { move.left = false; move.right = false; });

    async function loadProfile() {
        if (!currentUser) return;
        profileUsername.textContent = currentUser.username;
        profileHighscore.textContent = `أعلى نقاط: ${currentUser.highScore || 0}`;
        profilePicDisplay.src = currentUser.profilePictureUrl || defaultPic;
    }
    profilePicInput.onchange = (event) => { const file = event.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (e) => { profilePicDisplay.src = e.target.result; savePicBtn.style.display = 'inline-block'; }; reader.readAsDataURL(file); } };
    savePicBtn.onclick = async () => {
        if (!currentUser || !profilePicInput.files[0]) return;
        savePicBtn.disabled = true; savePicBtn.textContent = 'جاري الرفع...';
        const file = profilePicInput.files[0];
        const storageRef = ref(storage, `profile_pictures/${currentUser.username}`);
        try {
            const snapshot = await uploadBytes(storageRef, file);
            const downloadURL = await getDownloadURL(snapshot.ref);
            await updateDoc(doc(db, "users", currentUser.username), { profilePictureUrl: downloadURL });
            currentUser.profilePictureUrl = downloadURL;
            updateProfileIcon();
            savePicBtn.style.display = 'none'; showWelcomeMessage('تم حفظ الصورة بنجاح');
        } catch (error) { console.error("Upload error:", error); showWelcomeMessage('فشل رفع الصورة');
        } finally { savePicBtn.disabled = false; savePicBtn.textContent = 'حفظ الصورة'; }
    };

    function updateProfileIcon() {
        profileBtn.style.backgroundImage = `url(${currentUser?.profilePictureUrl || defaultPic})`;
    }

    function showWelcomeMessage(message) {
        const div = document.createElement('div');
        div.textContent = message;
        Object.assign(div.style, { position: 'fixed', top: '20px', left: '50%', transform: 'translateX(-50%)', padding: '10px 25px', background: 'rgba(40, 167, 69, 0.9)', color: 'white', borderRadius: '10px', zIndex: '1000', fontSize: '18px', fontWeight: 'bold', boxShadow: '0 4px 10px rgba(0,0,0,0.2)' });
        document.body.appendChild(div);
        setTimeout(() => { div.style.transition = 'opacity 0.5s'; div.style.opacity = '0'; setTimeout(() => div.remove(), 500); }, 2500);
    }
    
    function loadSavedUser() {
        const savedUserStr = localStorage.getItem('savedMariomaUser');
        if (savedUserStr) {
            try {
                const savedUser = JSON.parse(savedUserStr);
                instaUser.value = savedUser.u;
                privateIdInput.value = savedUser.p;
                validateInputs();
            } catch (e) { localStorage.removeItem('savedMariomaUser'); }
        }
    }

    // Initial setup
    showPage(gameContainer);
    loadSavedUser();
</script>
</body>
</html>
